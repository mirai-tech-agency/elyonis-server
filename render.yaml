# Render Blueprint -- single web service; data lives in Neon Postgres.
# Connect this repo to Render and choose "Blueprint" so it reads this file.

services:
  - type: web
    name: elyonis-license
    runtime: node
    plan: starter          # $7/mo, no spin-down. Free plan spins down after 15min.
    region: frankfurt      # closest to FR users; switch if your audience is elsewhere
    branch: main
    rootDir: .
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Neon connection string (project "elyonis-license", eu-central-1).
      - key: DATABASE_URL
        sync: false
      # Render exposes the listening port via the PORT env var (random).
      - key: PORT
        sync: false        # Render injects automatically
      # Secrets: set the actual values in the Render dashboard ("Environment"
      # tab) so they don't end up in git. The `generateValue: true` line
      # would also work but harder to recover if you need to re-deploy.
      - key: HMAC_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
